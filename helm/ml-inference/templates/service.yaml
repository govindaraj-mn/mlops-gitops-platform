apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ml-inference
  labels:
    app: ml-inference
spec:
  type: {{ .Values.service.type }}
  selector:
    app: ml-inference
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP