apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-inference
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/govindaraj-mn/mlops-gitops-platform.git
    targetRevision: main
    path: helm/ml-inference
  destination:
    server: https://kubernetes.default.svc
    namespace: ml-inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
